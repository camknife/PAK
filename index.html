          "acceptedAnswer": {
            "@type": "Answer",
            "text": "应用肌动学（Professional Applied Kinesiology，简称 PAK）是一套以徒手肌肉测试为核心诊断工具的整合性临床评估体系。它由美国脊医 George Goodheart 博士于 1964 年创立，经过 60 余年的发展，已形成覆盖结构（筋膜/关节/神经肌肉）、化学（营养/毒素/代谢）和心理（情绪/压力模式）三大维度的整体诊疗框架。"
          }
        },

          "@type": "Question",
          "name": "PAK 适合哪些专业人士学习？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PAK 面向物理治疗师/康复治疗师、整脊医生/正骨医师、自然疗法师/功能医学从业者、全科医生/专科医生、针灸师/中医师、牙科医生、运动康复教练/体能训练师等医疗健康专业人士。无医学基础者，PAK 涉及解剖学、生理学和神经学基础，完全零基础入门较为困难。"
          }
        },
