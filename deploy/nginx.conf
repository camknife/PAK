# 健衡学园 Nginx 站点配置（阿里云部署）
# 放置：/www/server/panel/vhost/nginx/pakfront.conf （宝塔）或 /etc/nginx/conf.d/pakfront.conf
# 建议在宝塔「网站」中创建站点后，用此配置替换其站点配置。

server {
    listen 80;
    server_name icak.com.cn www.icak.com.cn;   # ← 改成你的域名

    # 静态站点根目录（dist 构建产物）
    root /www/pakfront/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 静态资源长缓存（带 hash 的产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Node server（企业微信智能表格课程/咨询）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # SPA 路由回退：除真实文件外全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS（申请并部署证书后启用，宝塔可自动生成）
server {
    listen 443 ssl http2;
    server_name icak.com.cn www.icak.com.cn;   # ← 改成你的域名

    ssl_certificate /www/server/panel/vhost/cert/pakfront/fullchain.pem;      # ← 证书路径
    ssl_certificate_key /www/server/panel/vhost/cert/pakfront/privkey.pem;    # ← 密钥路径
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/pakfront/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

